# 量化工作台 nginx 反向代理配置（VPS 部署用）
# 放到 /etc/nginx/conf.d/quant.conf，把 server_name 换成你的域名
server {
    listen 80;
    server_name quant.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;   # 回测 / AI 生成可能耗时较长
    }
}
# HTTPS：certbot 一键配置（Let's Encrypt 免费证书）
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d quant.example.com
